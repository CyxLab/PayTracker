name: PayTrack Full Internship Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # --------------------------------------------------
  # STEP 1 : UNIT & INTEGRATION TESTS
  # --------------------------------------------------
  test_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Check Docker Availability
        run: docker info

      - name: Run Tests
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress

      - name: Upload rapports Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # --------------------------------------------------
  # STEP 2 : CODE QUALITY
  # --------------------------------------------------
  code_quality_job:
    needs: test_job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Linting (Checkstyle)
        run: ./mvnw checkstyle:check --no-transfer-progress
        continue-on-error: true

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  # --------------------------------------------------
  # STEP 3 : SECURITY SCAN
  # --------------------------------------------------
  sast_job:
    needs: test_job
    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Cache OWASP NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-${{ runner.os }}-

      - name: Security Scan
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 --no-transfer-progress
        continue-on-error: true

      - name: Upload rapport OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

      - name: Verify Security Report
        if: always()
        run: |
          if [ -f "target/dependency-check-report.html" ]; then
            echo "✅ Rapport OWASP généré"
          else
            echo "⚠️ Rapport non trouvé"
          fi

  # --------------------------------------------------
  # STEP 4 : PACKAGE + BUILD IMAGE
  # --------------------------------------------------
  package_job:
    needs:
      - code_quality_job
      - sast_job

    runs-on: ubuntu-latest

    outputs:
      image-name: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests --no-transfer-progress

      - name: Generate image name
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$REPO/paytrack_app
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # --------------------------------------------------
  # STEP 5 : CANARY DEPLOYMENT
  # --------------------------------------------------
  canary_job:
    needs: package_job
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: canary

    steps:
      - uses: actions/checkout@v4

      - name: Generate image name
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$REPO/paytrack_app" >> $GITHUB_ENV

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull $IMAGE_NAME:latest

      - name: Start PostgreSQL
        run: |
          docker compose up -d postgres

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 30); do
            if docker exec paytrack-postgres pg_isready -U user -d paytrack; then
              echo "✅ PostgreSQL is ready!"
              exit 0
            fi
            echo "PostgreSQL not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "❌ PostgreSQL did not become ready in time"
          docker logs paytrack-postgres
          exit 1

      - name: Start Canary App
        run: |
          docker rm -f paytrack-canary || true

          docker run -d \
            --name paytrack-canary \
            --network $(docker inspect \
            -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' \
            $(docker compose ps -q postgres)) \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/paytrack \
            -e SPRING_DATASOURCE_USERNAME=user \
            -e SPRING_DATASOURCE_PASSWORD=password \
            -e SPRING_PROFILES_ACTIVE=canary \
            -p 8081:8080 \
            $IMAGE_NAME:latest

      - name: Health Check
        run: |
          echo "Waiting for application to be healthy..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/actuator/health; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "Application not ready yet (attempt $i/20)..."
            sleep 5
          done
          echo "❌ Health check failed after 20 attempts"
          docker logs paytrack-canary
          exit 1

      - name: Dump logs if failure
        if: failure()
        run: docker logs paytrack-canary || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f paytrack-canary || true
          docker compose down || true

  # --------------------------------------------------
  # STEP 6 : PRODUCTION DEPLOYMENT
  # --------------------------------------------------
  deploy_prod_job:
    needs: canary_job

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Stop stack
        run: |
          docker compose down || true

      - name: Deploy stack
        run: |
          docker compose up -d --build

      - name: Verify deployment
        run: |
          echo "Waiting for application to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "✅ Production deployment successful!"
              exit 0
            fi
            echo "Application not ready yet (attempt $i/30)..."
            sleep 5
          done
          echo "❌ Production health check failed"
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

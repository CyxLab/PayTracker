name: PayTrack Full Internship Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --- STEP 1 : UNIT TESTS & INTEGRATION ---
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Check Docker Availability (Testcontainers)
        run: docker info

      - name: Run Tests
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress

      - name: Upload rapports Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # --- STEP 2 : CODE QUALITY ---
  code_quality_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Linting (Checkstyle)
        run: ./mvnw checkstyle:check --no-transfer-progress
        continue-on-error: true # Ne bloque pas le pipeline sur les violations de style

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  # --- STEP 3 : SECURITY (SAST) ---
  sast_job:
    needs: test_job
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # Clé API NVD (secret GitHub)
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache OWASP NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Security Scan (OWASP Dependency Check)
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 --no-transfer-progress
        continue-on-error: true # Le scan peut échouer (NVD, réseau), on continue

      - name: Upload rapport OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

      # Vérification non bloquante : on affiche juste un warning si le rapport manque
      - name: Verify Security Report (non-blocking)
        if: always()
        shell: bash
        run: |
          if [ -f "target/dependency-check-report.html" ]; then
            echo "✅ Rapport OWASP généré avec succès"
          else
            echo "⚠️ Rapport OWASP non trouvé (le scan a peut-être échoué, mais ce n'est pas bloquant)"
            ls -la target/ || true
          fi

  # --- STEP 4 : PACKAGING ---
  package_job:
    needs: [code_quality_job, sast_job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build JAR with Maven
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Docker Build
        run: docker build -t paytrack_app:latest .

  # --- STEP 5 : CANARY (SMOKE TEST) ---
  canary_job:
    needs: package_job
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Canary Stack
        shell: bash
        run: |
          canary=$(docker ps -aq -f name=paytrack-canary)
          if [ -n "$canary" ]; then docker rm -f paytrack-canary; fi

          if ! docker network ls --filter name=^paytrack_net$ -q | grep -q .; then
            echo "Création du réseau paytrack_net..."
            docker network create paytrack_net
          fi

          docker compose up -d db
          echo "Attente du démarrage des services (20s)..."
          sleep 20

          DB_CONTAINER=$(docker compose ps -q db)
          DB_NETWORK=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$DB_CONTAINER")
          echo "Réseau utilisé par db : $DB_NETWORK"

          docker network connect paytrack_net "$DB_CONTAINER" 2>/dev/null || true

          docker run -d --name paytrack-canary \
            --network "$DB_NETWORK" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/paytrack \
            -e SPRING_DATASOURCE_USERNAME=user \
            -e SPRING_DATASOURCE_PASSWORD=password \
            -e SPRING_PROFILES_ACTIVE=canary \
            -p 8081:8080 paytrack_app:latest

      - name: Health Check
        shell: bash
        run: |
          echo "Vérification de l'API sur le port 8081..."
          sleep 15
          if curl -sf http://localhost:8081/actuator/health; then
            echo "✅ L'API est stable !"
          else
            echo "❌ ÉCHEC DU HEALTH CHECK : Logs de l'application ---"
            docker logs paytrack-canary
            exit 1
          fi

      - name: Test API Endpoints
        shell: bash
        run: |
          echo "Test des endpoints API..."
          if curl -sf http://localhost:8081/actuator/health; then
            echo "Health endpoint OK"
          else
            echo "API endpoint test failed"
            exit 1
          fi

      - name: Dump canary logs on failure
        if: failure()
        shell: bash
        run: docker logs paytrack-canary || true

      - name: Cleanup Canary
        if: always()
        shell: bash
        run: |
          echo "Nettoyage du test Canary..."
          if [ -n "$(docker ps -aq -f name=paytrack-canary)" ]; then docker rm -f paytrack-canary; fi
          docker compose down || true

  # --- STEP 6 : DEPLOYMENT IN PRODUCTION ---
  deploy_prod_job:
    needs: canary_job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing containers
        shell: bash
        run: |
          docker compose down || echo "No containers to stop"

      - name: Deploy Full Stack
        run: docker compose up -d --build

      - name: Verify Production Deployment
        shell: bash
        run: |
          echo "Waiting for services to be ready..."
          sleep 20
          if curl -sf http://localhost:8080/actuator/health; then
            echo "✅ Production deployment successful!"
          else
            echo "❌ Production deployment verification failed"
            docker compose logs || true
            exit 1
          fi
